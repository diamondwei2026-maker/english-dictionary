# ============================================================
# Render Blueprint — 英语母语者词典 (English Dictionary)
# ============================================================
# 部署文档：https://render.com/docs/blueprint-spec
#
# 前置准备：
#   1. 在 Render Dashboard 创建 MongoDB 实例（或使用 Atlas）
#   2. 将 MongoDB 连接字符串、JWT_SECRET、DEEPSEEK_API_KEY
#      填入下方 envVars 的 sync: false 变量
#   3. 推送本文件到 git 仓库，在 Render 中连接仓库即可自动部署
# ============================================================

services:
  # ---- API 服务 ----
  - name: english-dictionary-api
    type: web
    runtime: node
    region: singapore                     # 新加坡（低延迟覆盖亚太），可改为 oregon / frankfurt
    plan: starter                         # starter | standard | pro
    repo: https://github.com/diamondwei2026-maker/english-dictionary
    branch: develop
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      # ---- 基础 ----
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"

      # ---- 数据库（MongoDB Atlas 或 Render MongoDB）----
      - key: MONGODB_URI
        sync: false                     # 不提交到 git，在 Render Dashboard 手动填写
        # 示例：mongodb+srv://user:pass@cluster.mongodb.net/english-dictionary
      - key: DB_MAX_POOL_SIZE
        value: "10"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_CONNECT_TIMEOUT_MS
        value: "10000"

      # ---- JWT 认证 ----
      # ⚠️ 生产环境必须替换！生成：node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "2h"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"

      # ---- AI 词条生成（DeepSeek）----
      - key: DEEPSEEK_API_KEY
        sync: false                     # 在 Render Dashboard 手动填写
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1

      # ---- CORS（生产环境前端域名）----
      - key: CORS_ORIGINS
        value: https://english-dictionary.vercel.app

      # ---- Rate Limit ----
      - key: LOGIN_RATE_MAX
        value: "10"
      - key: AI_RATE_MAX
        value: "10"

      # ---- 缓存 ----
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TTL_DAILY_WORD
        value: "86400"
      - key: CACHE_TTL_WORDBANK_LIST
        value: "300"
      - key: CACHE_TTL_WORDBANK_DETAIL
        value: "300"
      - key: CACHE_TTL_WORD_DETAIL
        value: "600"
      - key: CACHE_TTL_WORD_LIST
        value: "300"
